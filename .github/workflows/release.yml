# Builds, tests, signs and publishes WinNotch whenever main gets a version (WinNotch.csproj <Version>) that has no
# release yet; the release and its tag (v0.6.6, …) are created here. Other pushes to main only run the tests.
# The app updates itself only from these releases, and only if the signature matches its built-in public key.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version (and whether it's already released)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$p = Get-Content WinNotch.csproj
          $v = ($p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "VERSION=$v" >> $env:GITHUB_ENV
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "NEW=false" >> $env:GITHUB_ENV; "v$v e deja publicată: doar testele." } else { "NEW=true" >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0

      - name: Tests (app)
        run: dotnet run --project tests/WinNotch.Tests.csproj -c Release

      - name: Tests (extension)
        run: |
          node tests/extension/ext.test.js
          node tests/extension/content.test.js
          node --test tests/extension/controls.test.js

      - name: Build
        if: env.NEW == 'true'
        run: dotnet publish WinNotch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Sign
        if: env.NEW == 'true'
        shell: pwsh
        env:
          RELEASE_KEY: ${{ secrets.WINNOTCH_RELEASE_KEY }}
        run: |
          if (-not $env:RELEASE_KEY) { throw "Lipsește secretul WINNOTCH_RELEASE_KEY" }
          $exe = "out/WinNotch.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $key = [System.Security.Cryptography.ECDsa]::Create()
          $read = 0
          $key.ImportPkcs8PrivateKey([Convert]::FromBase64String($env:RELEASE_KEY), [ref]$read)
          $msg = [System.Text.Encoding]::UTF8.GetBytes("WinNotch-release|$($env:VERSION)|$hash")
          $sig = $key.SignData($msg, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          [IO.File]::WriteAllText("out/WinNotch.exe.sig", [Convert]::ToBase64String($sig))
          "SHA-256: $hash"

      - name: Publish the release
        if: env.NEW == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ env.VERSION }}" out/WinNotch.exe out/WinNotch.exe.sig --target "${{ github.sha }}" --title "WinNotch ${{ env.VERSION }}" --notes-file RELEASE_NOTES.md
